name: Monitor oferta SIP Promart

on:
  schedule:
    - cron: "17 */2 * * *" # cada 2 horas
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Enviar correo de prueba"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar productos
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python promart_monitor/monitor.py ${{ inputs.test_mail && '--test-mail' || '' }}
      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add promart_monitor/state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado monitor SIP" && git push)
